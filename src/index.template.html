<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shadani 3D Candy Demo</title>
<meta name="description" content="Interactive 3D candy experience, a concept demo for Shadani.">
<meta name="theme-color" content="#FFF3E2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23E73430'/%3E%3Ccircle cx='11' cy='11' r='4' fill='%23fff' opacity='.55'/%3E%3C/svg%3E">
<!--CSS-->
</head>
<body>
  <div class="backdrop" aria-hidden="true"><div class="word" id="word">ORANGE</div></div>
  <canvas id="stage" aria-label="3D view of a Shadani candy can. Use the flavour buttons below to open it."></canvas>

  <header class="top">
    <a class="logo" href="https://shadanigroup.com/" target="_blank" rel="noopener"><img id="logo" alt="Shadani"></a>
    <div class="top-actions">
      <button class="icon-btn" id="sound" type="button" aria-pressed="true" aria-label="Sound"></button>
      <a class="btn" href="https://shadanigroup.com/collections/all" target="_blank" rel="noopener">Shop Now</a>
    </div>
  </header>

  <h2 class="headline">Pick a flavour, open the can</h2>

  <button class="nav prev" id="prev" type="button" aria-label="Previous flavour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="nav next" id="next" type="button" aria-label="Next flavour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>

  <div class="caption" id="caption">
    <strong id="cap-name"></strong><span id="cap-price"></span><em>Tap the can to open</em>
  </div>

  <p class="drag-tip" id="drag-tip" aria-hidden="true">Drag to spin</p>

  <aside class="card" id="card" aria-live="polite" aria-hidden="true">
    <button class="close" id="close" type="button" aria-label="Close and put the candy back">&times;</button>
    <img class="pack" id="c-pack" alt="" hidden>
    <p class="eyebrow" id="c-weight"></p>
    <h1 id="c-name"></h1>
    <p class="tagline" id="c-tagline"></p>
    <ul class="tags" id="c-tags"></ul>
    <div class="buy">
      <div class="price"><strong id="c-price"></strong><s id="c-was"></s><span class="off" id="c-off"></span></div>
      <a class="btn" id="c-link" target="_blank" rel="noopener">View on Store<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </div>
  </aside>

  <nav class="chips" id="chips" aria-label="Choose a flavour"></nav>
  <p class="foot">Concept demo, not the official Shadani store</p>

  <div class="loader" id="loader" role="status" aria-label="Loading"><span></span><img id="loader-logo" alt=""></div>
<!--JS-->
</body>
</html>
